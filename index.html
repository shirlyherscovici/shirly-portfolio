    <!-- Hero character's frame-scrub sprite (121 frames, ~535KB) — above-the-fold
         and driven by continuous mouse movement from first paint, so it's worth
         a real preload hint rather than waiting on React to mount the <img>.
         %BASE_URL% is Vite's own index.html substitution — same base path the
         asset() helper prefixes onto every other runtime asset reference. -->
    <link rel="preload" as="image" type="image/webp" href="%BASE_URL%assets/hub/character-vid-sprite.webp" fetchpriority="high" />
  </head>
